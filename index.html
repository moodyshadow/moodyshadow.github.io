<!DOCTYPE html>

<head>

<title>Daily Overclocked</title>
<style>

  .wrap { max-width: 640px; margin: 0 auto; padding: 64px 24px; text-align: center; }

  p.tag { color: #aaa; margin-top: 0; margin-bottom: 40px; }

    display: block; padding: 14px 20px; border-radius: 8px;
    background: #16191d; color: #fff; text-decoration: none; font-weight: 600;
    border: 1px solid #2a2e33; transition: background 0.15s;
  }
  .links a:hover { background: #1f2328; }
</style>

<div class="wrap">
  <h1>Daily Overclocked</h1>

  <div class="links">
